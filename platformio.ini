; Nowde — ESP32-S3 sync node firmware. One source, one env per board.
;
;   esp32-s3-devkitc-1  MillluBridge baseline: native USB = MIDI, UART port = flash + logs
;   atoms3              M5Stack AtomS3 (LCD) and AtomS3 Lite (LED): single USB-C carrying
;                       MIDI + CDC (logs, esptool auto-reset). The board is detected at
;                       boot: AtomS3 -> master, AtomS3 Lite -> slave (override: NVS/SysEx
;                       SET_ROLE, or -DNOWDE_ROLE_DEFAULT=0|1 below).

[platformio]
default_envs = esp32-s3-devkitc-1

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; ESPNowMeshClock is VENDORED into lib/ESPNowMeshClock (was the git dep below) so the
; hardening changes (torn-read guard in _broadcast, reset()) build and flash from this repo.
; Upstream at github.com/Hemisphere-Project/ESPNowMeshClock@1.0.0 — push these changes there later.
;   https://github.com/Hemisphere-Project/ESPNowMeshClock.git
lib_deps =
extra_scripts = post:copy_firmware.py
build_flags =
    -Os                          ; Optimize for size
    -DCORE_DEBUG_LEVEL=0         ; Disable debug output
    -ffunction-sections          ; Remove unused functions
    -fdata-sections              ; Remove unused data
build_unflags =
    -O2

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1         ; HW JTAG-CDC stays on the PHY until USB.begin() (MIDI)
    -DARDUINO_USB_CDC_ON_BOOT=0  ; Serial = UART0 on the second USB port

[env:atoms3]
board = m5stack-atoms3
board_build.partitions = default_8MB.csv
; re-flash through the node's own CDC port: PlatformIO opens it at 1200 bps (the firmware
; drops into the ROM bootloader), waits for the ROM's port to appear, then esptool runs there
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
; the board manifest injects -DARDUINO_USB_MODE=1: unflag it explicitly so our =0
; below does not depend on -D ordering
build_unflags =
    ${env.build_unflags}
    -DARDUINO_USB_MODE=1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=0         ; TinyUSB OTG: composite MIDI + CDC
    -DARDUINO_USB_CDC_ON_BOOT=0  ; we begin the CDC ourselves, after setting the descriptors
    -DNOWDE_BOARD_ATOMS3
    -DNOWDE_STOP_ON_LINK_LOST=0  ; freewheel: an RF gap costs drift, not an audible stop
lib_deps =
    ${env.lib_deps}
    m5stack/M5Unified@^0.2.20

[env:atoms3-master]
; same binary, role forced to master (bench / when detection must not decide)
extends = env:atoms3
build_flags =
    ${env:atoms3.build_flags}
    -DNOWDE_ROLE_DEFAULT=1

[env:atoms3-slave]
extends = env:atoms3
build_flags =
    ${env:atoms3.build_flags}
    -DNOWDE_ROLE_DEFAULT=0

[env:atoms3-coarsetest]
; BENCH ONLY (2.0.1). Desync threshold 0 forces every MEDIA_SYNC into the coarse path with no
; real mesh desync, to prove Fix A (still follows the master) + the re-sync self-heal on hardware.
; Flash a single SLAVE with this, observe, then re-flash the real `atoms3` build. Never ship it.
extends = env:atoms3
build_flags =
    ${env:atoms3.build_flags}
    -DNOWDE_ROLE_DEFAULT=0
    -DCLOCK_DESYNC_THRESHOLD_MS_VAL=0

[env:atoms3-bcast]
; MEDIA_SYNC relayed as one broadcast frame instead of one unicast per slave (bench build)
extends = env:atoms3
build_flags =
    ${env:atoms3.build_flags}
    -DNOWDE_MEDIASYNC_BROADCAST=1

[env:atoms3-lr]
; same binary, long-range PHY on: the on-site fallback when a path (foliage, masonry)
; will not hold at the default 1 Mbps. LR is all-or-nothing -- flash every node of the
; mesh or none, a node left behind goes invisible rather than degraded.
extends = env:atoms3
build_flags =
    ${env:atoms3.build_flags}
    -DNOWDE_WIFI_LR=1
